name: Build Mazda CarPlay HUD 2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 複製程式碼到雲端電腦
      uses: actions/checkout@v4

    - name: 2. 安裝 Linux 標準 ARM 編譯工具
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi make

    - name: 3. 強制修正 Makefile 的編譯器路徑為系統內建
      run: |
        # 這一步會把作者原本寫死的 ./m3-toolchain 路徑替換掉，改用 Linux 內建的標準編譯器
        sed -i 's|CXX         := $(M3TOOLCHAIN)/bin/$(TRIPLE)-g++|CXX         := arm-cortexa9_neon-linux-gnueabi-g++|g' mazda/Makefile
        sed -i 's|CXX         := arm-cortexa9_neon-linux-gnueabi-g++|CXX         := arm-linux-gnueabi-g++|g' mazda/Makefile
        sed -i 's|--sysroot=$(SYSROOT)||g' mazda/Makefile

    - name: 4. 開始編譯 (不卡死、不亂碼版本)
      run: |
        cd mazda
        make release

    - name: 5. 將編譯好的成品打包出來
      uses: actions/upload-artifact@v4
      with:
        name: mazda-hud-2.0-tw-edition
        path: mazda/build/release/libpatch-blmjcicarplay.so
